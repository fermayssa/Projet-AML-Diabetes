{% extends "base.html" %}

{% block title %}Modifier Utilisateur{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="fas fa-user-edit"></i> Modifier Utilisateur</h1>
  <a href="{{ url_for('users_list') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Retour à la liste</a>
</div>

<div class="form-container">
  <form method="POST" action="{{ url_for('edit_user', user_id=user.id) }}">
    <div class="form-section">
      <h2>Informations de l'utilisateur</h2>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ user.username }}" readonly>
        <small>Le username ne peut pas être modifié</small>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ user.email or '' }}">
      </div>
      <div class="form-group">
        <label for="role">Rôle *</label>
        <select id="role" name="role" required>
          <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrateur</option>
          <option value="medecin" {% if user.role == 'medecin' %}selected{% endif %}>Médecin</option>
          <option value="infirmier" {% if user.role == 'infirmier' %}selected{% endif %}>Infirmier</option>
          <option value="gestionnaire" {% if user.role == 'gestionnaire' %}selected{% endif %}>Gestionnaire</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Nouveau mot de passe (laisser vide pour ne pas changer)</label>
        <input type="password" id="password" name="password" placeholder="Laisser vide pour garder le mot de passe actuel">
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 💾 Enregistrer les modifications</button>
      <a href="{{ url_for('users_list') }}" class="btn btn-secondary">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
