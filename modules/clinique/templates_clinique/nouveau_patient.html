{% extends "base.html" %}

{% block title %}Nouveau Patient - Clinique{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="fas fa-user-plus"></i> Nouveau Patient</h1>
  <a href="{{ url_for('clinique.patients') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Retour à la liste</a>
</div>

<div class="form-container">
  <form method="POST" action="{{ url_for('clinique.patients') }}">
    <div class="form-section">
      <h2>Informations personnelles</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="nom">Nom *</label>
          <input type="text" id="nom" name="nom" required>
        </div>
        <div class="form-group">
          <label for="prenom">Prénom *</label>
          <input type="text" id="prenom" name="prenom" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="date_naissance">Date de naissance *</label>
          <input type="date" id="date_naissance" name="date_naissance" required>
        </div>
        <div class="form-group">
          <label for="sexe">Sexe *</label>
          <select id="sexe" name="sexe" required>
            <option value="">Sélectionner...</option>
            <option value="M">Masculin</option>
            <option value="F">Féminin</option>
            <option value="A">Autre</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2>Contact</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="telephone">Téléphone *</label>
          <input type="tel" id="telephone" name="telephone" required placeholder="0612345678">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="email@exemple.com">
        </div>
      </div>
      <div class="form-group">
        <label for="adresse">Adresse</label>
        <textarea id="adresse" name="adresse" rows="3" placeholder="Adresse complète..."></textarea>
      </div>
    </div>

    <div class="form-section">
      <h2>Informations médicales</h2>
      <div class="form-group">
        <label for="groupe_sanguin">Groupe sanguin</label>
        <select id="groupe_sanguin" name="groupe_sanguin">
          <option value="">Inconnu</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
        </select>
      </div>
      <div class="form-group">
        <label for="antecedents">Antécédents médicaux</label>
        <textarea id="antecedents" name="antecedents" rows="3" placeholder="Allergies, maladies chroniques, interventions chirurgicales..."></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 💾 Enregistrer le patient</button>
      <a href="{{ url_for('clinique.patients') }}" class="btn btn-secondary">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
