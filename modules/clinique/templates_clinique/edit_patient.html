{% extends "base.html" %}

{% block title %}Modifier Patient - Clinique{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="fas fa-user-edit"></i> Modifier Patient</h1>
  <a href="{{ url_for('clinique.patients') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Retour à la liste</a>
</div>

<div class="form-container">
  <form method="POST" action="{{ url_for('clinique.edit_patient', patient_id=patient.id) }}">
    <div class="form-section">
      <h2>Informations personnelles</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="nom">Nom *</label>
          <input type="text" id="nom" name="nom" required value="{{ patient.nom or '' }}">
        </div>
        <div class="form-group">
          <label for="prenom">Prénom *</label>
          <input type="text" id="prenom" name="prenom" required value="{{ patient.prenom or '' }}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="age">Âge *</label>
          <input type="number" id="age" name="age" required value="{{ patient.age or '' }}">
        </div>
        <div class="form-group">
          <label for="sexe">Sexe *</label>
          <select id="sexe" name="sexe" required>
            <option value="">Sélectionner...</option>
            <option value="M" {% if patient.sexe == 'M' %}selected{% endif %}>Masculin</option>
            <option value="F" {% if patient.sexe == 'F' %}selected{% endif %}>Féminin</option>
            <option value="A" {% if patient.sexe == 'A' %}selected{% endif %}>Autre</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="date_naissance">Date de naissance</label>
        <input type="date" id="date_naissance" name="date_naissance" value="{{ patient.date_naissance or '' }}">
      </div>
    </div>

    <div class="form-section">
      <h2>Contact</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="telephone">Téléphone</label>
          <input type="tel" id="telephone" name="telephone" value="{{ patient.telephone or '' }}" placeholder="0612345678">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ patient.email or '' }}" placeholder="email@exemple.com">
        </div>
      </div>
      <div class="form-group">
        <label for="adresse">Adresse</label>
        <textarea id="adresse" name="adresse" rows="3" placeholder="Adresse complète...">{{ patient.adresse or '' }}</textarea>
      </div>
    </div>

    <div class="form-section">
      <h2>Informations médicales</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="diabetes_type">Type de diabète</label>
          <select id="diabetes_type" name="diabetes_type">
            <option value="">Non spécifié</option>
            <option value="Type 1" {% if patient.diabetes_type == 'Type 1' %}selected{% endif %}>Type 1</option>
            <option value="Type 2" {% if patient.diabetes_type == 'Type 2' %}selected{% endif %}>Type 2</option>
            <option value="Gestational" {% if patient.diabetes_type == 'Gestational' %}selected{% endif %}>Gestationnel</option>
            <option value="Other" {% if patient.diabetes_type == 'Other' %}selected{% endif %}>Autre</option>
          </select>
        </div>
        <div class="form-group">
          <label for="date_diagnostic">Date de diagnostic</label>
          <input type="date" id="date_diagnostic" name="date_diagnostic" value="{{ patient.date_diagnostic or '' }}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="hba1c">HbA1c (%)</label>
          <input type="number" step="0.1" id="hba1c" name="hba1c" value="{{ patient.hba1c or '' }}">
        </div>
        <div class="form-group">
          <label for="glycemie">Glycémie (g/L)</label>
          <input type="number" step="0.01" id="glycemie" name="glycemie" value="{{ patient.glycemie or '' }}">
        </div>
      </div>
      <div class="form-group">
        <label for="traitement">Traitement</label>
        <textarea id="traitement" name="traitement" rows="3" placeholder="Médicaments et dosages...">{{ patient.traitement or '' }}</textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 💾 Enregistrer les modifications</button>
      <a href="{{ url_for('clinique.patients') }}" class="btn btn-secondary">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
