<style>
  .seg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .seg-clin fieldset { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
                       padding: 16px 20px 20px; margin-bottom: 16px; }
  .seg-clin legend { font-weight: 700; color: #4c1d95; padding: 0 8px; }
  .seg-clin label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #374151; }
  .seg-clin label.seg-check { flex-direction: row; align-items: center; gap: 8px; }
  .seg-clin input[type=number], .seg-clin select { padding: 8px 10px; border: 1px solid #d1d5db;
                       border-radius: 8px; font-size: 14px; background: #fff; }
</style>
<div class="seg-clin">
  <fieldset><legend>Patient et séjour</legend>
    <div class="seg-grid">
      {% for name, label, lo, hi, default in numeric %}
      <label>{{ label }}
        <input type="number" id="seg_{{ name }}" name="{{ name }}" min="{{ lo }}" max="{{ hi }}" required
               value="{{ values.get(name, default) }}">
      </label>
      {% endfor %}
      <label>Sexe
        <select name="gender" id="seg_gender">
          <option value="Female" {{ 'selected' if values.get('gender') == 'Female' }}>Femme</option>
          <option value="Male" {{ 'selected' if values.get('gender') == 'Male' }}>Homme</option>
        </select>
      </label>
      <label>Traitement modifié pendant le séjour ?
        <select name="change"><option value="0">Non</option><option value="1" {{ 'selected' if values.get('change') == '1' }}>Oui</option></select>
      </label>
      <label>Antidiabétique prescrit ?
        <select name="diabetesMed"><option value="1">Oui</option><option value="0" {{ 'selected' if values.get('diabetesMed') == '0' }}>Non</option></select>
      </label>
    </div>
  </fieldset>

  <fieldset><legend>Contexte clinique</legend>
    <div class="seg-grid">
      {% for var, label, cats, mode in nominal %}
      <label>{{ label }}
        <select name="{{ var }}">
          {% for c in cats %}<option value="{{ c }}" {{ 'selected' if c == values.get(var, mode) }}>{{ c }}</option>{% endfor %}
        </select>
      </label>
      {% endfor %}
      {% for key, label in comorb %}
      <label class="seg-check"><input type="checkbox" name="{{ key }}" {{ 'checked' if values.get(key) }}> {{ label }}</label>
      {% endfor %}
    </div>
  </fieldset>

  <fieldset><legend>Traitement antidiabétique</legend>
    <div class="seg-grid">
      <label>Insuline
        <select name="insulin_state">
          {% for s, l in [('No','Non prescrite'),('Steady','Dose stable'),('Up','Dose augmentée'),('Down','Dose diminuée')] %}
          <option value="{{ s }}" {{ 'selected' if values.get('insulin_state') == s }}>{{ l }}</option>{% endfor %}
        </select>
      </label>
      {% for m in meds %}
      <label class="seg-check"><input type="checkbox" name="med_{{ m }}" {{ 'checked' if values.get('med_' ~ m) }}> {{ m }}</label>
      {% endfor %}
    </div>
  </fieldset>
</div>
